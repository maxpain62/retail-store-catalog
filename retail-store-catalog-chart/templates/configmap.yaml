apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.metadata.labels.app }}-configmap
data:
  RETAIL_CATALOG_PERSISTENCE_PROVIDER: mysql
  RETAIL_CATALOG_PERSISTENCE_ENDPOINT: {{ .Values.metadata.labels.app }}-mysql-service:3306
  RETAIL_CATALOG_PERSISTENCE_DB_NAME: catalog
  RETAIL_CATALOG_SEARCH_ENABLED: "false"